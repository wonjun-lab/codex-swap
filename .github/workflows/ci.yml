name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # bash 판이 macOS 에서 조용히 깨진 전력이 있다(BSD find 에 -newermt 가 없어 정상 락도
    # stale 로 오판). Python 판은 그 차이를 없애는 것이 목표이므로 양쪽에서 돌린다.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
