[project]
name = "codex-swap"
version = "0.1.0"
description = "Multi-account switcher for the Codex CLI — stores, probes, and rotates ChatGPT accounts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# 런타임 의존 없음. 프로브는 표준 라이브러리 subprocess + json 으로 app-server 와
# 직접 NDJSON JSON-RPC 를 주고받는다. 이식하는 bash 판이 요구하던 jq · base64 · node
# 는 전부 표준 라이브러리로 대체된다.
dependencies = []

[project.scripts]
# 진입점은 이것 하나뿐이다. 다른 이름을 여기서 함께 노출하면, 그 이름이 이미
# `~/.local/bin` 에 있는 기기에서 `uv tool install` 이 통째로 실패한다 — uv 는 자신이
# 관리하지 않는 실행 파일을 덮지 않고, 그 충돌을 설치 전에 먼저 검사한다.
codex-swap = "codex_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_swap"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
